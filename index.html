function drawImg(img, x, y, w, h, flip, rot) {
  if (!img || !img.complete || !img.naturalWidth) { ctx.fillStyle = "#c9a"; ctx.fillRect(x - w/2, y - h, w, h); return; }
  ctx.save(); ctx.translate(x, y);
  if (rot) ctx.rotate(rot);
  if (flip) ctx.scale(-1, 1);
  ctx.drawImage(img, -w/2, -h, w, h);
  ctx.restore();
}
const TINT = {};
function getTint(c) {
  if (TINT[c.id]) return TINT[c.id];
  const im = IMG[c.img]; if (!im.naturalWidth) return im;
  const cn = document.createElement("canvas"); cn.width = im.naturalWidth; cn.height = im.naturalHeight;
  const x = cn.getContext("2d"); x.drawImage(im, 0, 0);
  x.globalCompositeOperation = "source-atop"; x.fillStyle = "rgba(255,50,80,.55)"; x.fillRect(0, 0, cn.width, cn.height);
  TINT[c.id] = cn; return cn;
}

// Animação procedural: o sprite é fatiado em corpo + dois pés, que se mexem de acordo com a ação.
function poseOf(p, c, t) {
  const f = p.face, P = { face:f, sx:1, sy:1, rot:0, dx:0, bodyY:0, feet:[{x:0,y:0},{x:0,y:0}] };
  const sp = Math.abs(p.vx);
  if (p.hurtT > 0) { P.rot = -f * 0.28 * Math.min(1, p.hurtT / .45); P.sy = .94; P.sx = 1.04; }
  else if (!p.ground) {
    if (p.vy < 0) { P.sy = 1.1; P.sx = .93; P.feet = [{x:-2,y:-4},{x:3,y:-2}]; }       // pulo
    else { P.sy = .97; P.sx = 1.03; P.feet = [{x:-3,y:-1},{x:3,y:-3}];                   // queda
      if (p.gliding) { P.sx = 1.12; P.sy = .92; P.rot = Math.sin(t * .008) * .07; } }       // planar
  } else if (sp > 25) {                                                                 // andar / correr
    const run = p.running, ph = p.phase, amp = run ? 5 : 3;
    P.rot = f * (run ? .12 : .04); P.bodyY = -Math.abs(Math.sin(ph)) * (run ? 4 : 2.5);
    P.feet[0] = { x:Math.sin(ph) * amp, y:-Math.max(0, Math.cos(ph)) * amp };
    P.feet[1] = { x:-Math.sin(ph) * amp, y:-Math.max(0, -Math.cos(ph)) * amp };
  } else { const b = Math.sin(t * .003); P.sy = 1 + b * .02; P.sx = 1 - b * .01; }       // parado: respira
  if (p.landT > 0) { P.sy *= .9; P.sx *= 1.08; }
  if (p.atkT > 0) { const a = p.atkT / .25; P.dx = f * 5 * a; P.sx *= 1 + .06 * a; P.rot += f * -.06 * a; } // ataque
  return P;
}
function drawChar(c, x, footY, P, hgt, tint) {
  const img = tint ? getTint(c) : IMG[c.img];
  const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
  if (!iw) return;
  const split = Math.round(ih * c.split), sc = hgt / ih, dw = iw * sc, bodyH = split * sc, footH = (ih - split) * sc;
  ctx.save(); ctx.translate(x + P.dx, footY); ctx.rotate(P.rot); ctx.scale((P.face < 0 ? -1 : 1) * P.sx, P.sy);
  for (let i = 0; i < 2; i++) ctx.drawImage(img, i * iw / 2, split, iw / 2, ih - split, -dw/2 + i * dw/2 + P.feet[i].x, -footH + P.feet[i].y, dw/2, footH);
  ctx.drawImage(img, 0, 0, iw, split, -dw/2, -footH - bodyH + P.bodyY, dw, bodyH);
  ctx.restore();
}

  ctx.fillText(m + ":" + String(s).padStart(2, "0") + (muted ? " · mudo" : ""), W - 22, 55);
  ctx.font = "12px system-ui"; ctx.fillStyle = "rgba(232,244,242,.85)"; ctx.fillText("Objetivo: " + LV.objective, W - 16, 82);

  // barra de vida do boss
  const b = G.boss;
  if (b && !b.dead && (G.arena || p.x > LV.arenaX - 500)) {
    const bx = 332, by = 38, bw = 296, bh = 16, f = Math.max(0, b.hp / b.maxhp);
    ctx.fillStyle = "rgba(8,28,38,.85)"; roundRect(bx - 10, 12, bw + 20, 52, 10); ctx.fill();
    ctx.textAlign = "center"; ctx.fillStyle = b.kind === "core" ? "#ffb347" : "#ff9fc4"; ctx.font = "bold 13px system-ui"; ctx.fillText(b.name + "  " + b.hp + "/" + b.maxhp, bx + bw/2, 31);
    ctx.fillStyle = "rgba(255,255,255,.14)"; ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = f > .5 ? (b.kind === "core" ? "#ff9a3c" : "#c862e0") : "#ff4d6a"; ctx.fillRect(bx, by, bw * f, bh);
    ctx.fillStyle = "rgba(8,28,38,.9)"; for (let i = 1; i < b.maxhp; i++) ctx.fillRect(bx + bw * i / b.maxhp - 1, by, 2, bh);
  }
  if (G.bannerT > 0 && !G.dead) {
    const a = Math.min(1, G.bannerT);
    ctx.globalAlpha = a; ctx.textAlign = "center";
    ctx.fillStyle = "rgba(8,28,38,.78)"; roundRect(W/2 - 280, 215, 560, 84, 12); ctx.fill();
    ctx.fillStyle = "#f2b84b"; ctx.font = "bold 28px system-ui"; ctx.fillText(LEVELS[curLevel].name + " · " + LEVELS[curLevel].title, W/2, 254);
    ctx.fillStyle = "#e8f4f2"; ctx.font = "15px system-ui"; ctx.fillText(LV.objective, W/2, 282);
    ctx.globalAlpha = 1;
  }
  if (G.toastT > 0) {
    ctx.textAlign = "center"; ctx.font = "bold 16px system-ui";
    const tw = Math.max(300, ctx.measureText(G.toast).width + 40);
    ctx.fillStyle = "rgba(8,28,38,.88)"; roundRect(W/2 - tw/2, 150, tw, 36, 10); ctx.fill();
    ctx.fillStyle = "#f2b84b"; ctx.fillText(G.toast, W/2, 174);
  }
  ctx.textAlign = "left";
}

// ---------- Vitória e derrota ----------
function setWin() { state = "win"; G.endT = 0; G.starN = 0; }
const WINTXT = [
  { t:"Fase 1 concluída!", s:"O Nó Central foi restaurado. Seu protagonista segue com você.", next:"Próxima: Fase 2 · Vale das Ondas", b:"Ir para a Fase 2" },
  { t:"Fase 2 concluída!", s:"O Guardião das Ondas caiu e o portal se abriu.", next:"Próxima: Fase 3 · Núcleo, onde mora A Tempestade", b:"Ir para a Fase 3" },
  { t:"Vitória final!", s:"A Tempestade foi dissipada e os Guardiões do Ritmo restauraram o Núcleo. Fim da versão beta.", next:"Obrigado por jogar!", b:"Jogar de novo" }
];
const CARD = { x:130, y:18, w:700, h:504 };
const winBtns = [{ x:300, y:460, w:170, h:44 }, { x:490, y:460, w:170, h:44 }];
const loseBtns = [{ x:300, y:392, w:170, h:44 }, { x:490, y:392, w:170, h:44 }];
function panel(col) {
  if (curLevel < 2) { ctx.fillStyle = "rgba(4,14,22,.82)"; ctx.fillRect(0, 0, W, H); }
  ctx.fillStyle = "#0b1d29"; roundRect(CARD.x, CARD.y, CARD.w, CARD.h, 18); ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = col; ctx.stroke();
}
function starShape(x, y, r, on) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  ctx.closePath(); ctx.fillStyle = on ? "#f2b84b" : "rgba(255,255,255,.14)"; ctx.fill();
}
function button(r, label, primary) {
  const hot = inRect(r, mouse.x, mouse.y);
  ctx.fillStyle = primary ? (hot ? "#ffd070" : "#f2b84b") : (hot ? "rgba(255,255,255,.22)" : "rgba(255,255,255,.12)");
  roundRect(r.x, r.y, r.w, r.h, 10); ctx.fill();
  if (!primary) { ctx.lineWidth = 1.5; ctx.strokeStyle = "rgba(232,244,242,.45)"; ctx.stroke(); }
  ctx.fillStyle = primary ? "#1a2a30" : "#e8f4f2"; ctx.font = "bold 16px system-ui"; ctx.textAlign = "center";
  ctx.fillText(label, r.x + r.w / 2, r.y + 28);
}
function goNext() { if (curLevel < 2) newGame(sel, curLevel + 1, G.carry + G.total, G.heal); else newGame(sel, 0); }
function calcStars() { return 1 + (G.total / G.max >= .75 ? 1 : 0) + (G.hp >= 3 ? 1 : 0); }
function updateWin(dt) {
  G.endT += dt;
  const need = calcStars(), marks = [1.2, 1.6, 2.0];
  while (G.starN < 3 && G.endT > marks[G.starN]) { if (G.starN < need) beep(660 + G.starN * 180, .25, "triangle", .06); G.starN++; }
  if (wasPressed("enter")) goNext();
  if (wasPressed("escape","m")) state = "menu";
  if (mouse.click) {
    if (inRect(winBtns[0], mouse.x, mouse.y)) goNext();
    if (inRect(winBtns[1], mouse.x, mouse.y)) state = "menu";
  }
}
function drawWin(tt) {
  drawPlay(tt);
  const T = WINTXT[curLevel], th = LV.theme, e = G.endT || 0, k = Math.min(1, e / 1.0), last = curLevel === 2;
  if (last) { // confete lento atrás do cartão (sem piscar)
    const cols = [th.edge, "#8fe3e0", "#ff9fc4", "#e8f4f2"];
    ctx.fillStyle = "rgba(4,14,22,.82)"; ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 70; i++) {
      const x = (i * 131) % W + Math.sin(tt * .001 + i) * 14, y = ((tt * .045 * (.6 + (i % 5) * .14) + i * 61) % (H + 30)) - 15;
      ctx.fillStyle = cols[i % 4]; ctx.fillRect(x, y, 6, 9);
    }
  }
  panel(th.edge);
  // faixa do título
  ctx.save(); roundRect(CARD.x, CARD.y, CARD.w, 76, 18); ctx.clip();
  ctx.fillStyle = th.edge; ctx.fillRect(CARD.x, CARD.y, CARD.w, 76); ctx.restore();
  ctx.textAlign = "center"; ctx.fillStyle = "#14181c"; ctx.font = "bold 34px system-ui"; ctx.fillText(T.t, W/2, CARD.y + 50);
  // retrato do protagonista
  const c = G.c, bob = Math.sin(tt * .004) * 4;
  ctx.fillStyle = "rgba(255,255,255,.05)"; roundRect(CARD.x + 30, CARD.y + 100, 190, 230, 14); ctx.fill();
  ctx.fillStyle = th.ground; ctx.fillRect(CARD.x + 40, CARD.y + 300, 170, 10);
  drawChar(c, CARD.x + 125, CARD.y + 300 + bob * .0, { face:1, sx:1, sy:1 + Math.sin(tt * .003) * .02, rot:0, dx:0, bodyY:bob * -.5, feet:[{x:0,y:0},{x:0,y:0}] }, 150, false);
  ctx.fillStyle = "#e8f4f2"; ctx.font = "bold 18px system-ui"; ctx.fillText(c.name, CARD.x + 125, CARD.y + 326);
  // estatísticas
  const rx = CARD.x + 260, rw = CARD.w - 290;
  ctx.textAlign = "left"; ctx.fillStyle = "#8fe3e0"; ctx.font = "bold 13px system-ui"; ctx.fillText("FRASCOS DESTA FASE", rx, CARD.y + 118);
  drawImg(IMG.potion1, rx + 14, CARD.y + 168, 28, 32, false);
  ctx.fillStyle = "#fff"; ctx.font = "bold 30px system-ui"; ctx.fillText(Math.round(G.total * k) + " / " + G.max, rx + 40, CARD.y + 160);
  ctx.fillStyle = "rgba(255,255,255,.14)"; ctx.fillRect(rx + 170, CARD.y + 144, rw - 170, 14);
  ctx.fillStyle = th.edge; ctx.fillRect(rx + 170, CARD.y + 144, (rw - 170) * (G.total / G.max) * k, 14);
  ctx.fillStyle = "#8fe3e0"; ctx.font = "bold 13px system-ui"; ctx.fillText("VIDA RESTANTE", rx, CARD.y + 206);
  for (let i = 0; i < MAXHP; i++) heart(rx + i * 28, CARD.y + 216, i < G.hp && e > .5);
  ctx.fillText("TEMPO", rx + 200, CARD.y + 206);
  const m = Math.floor(G.time / 60), s = Math.floor(G.time % 60);
  ctx.fillStyle = "#fff"; ctx.font = "bold 22px system-ui"; ctx.fillText(m + ":" + String(s).padStart(2, "0"), rx + 200, CARD.y + 238);
  // estrelas
  const need = calcStars();
  for (let i = 0; i < 3; i++) {
    const shown = (G.starN || 0) > i, pop = shown ? 1 : .0001;
    ctx.save(); ctx.translate(rx + 40 + i * 70, CARD.y + 292); ctx.scale(pop, pop); starShape(0, 0, 28, shown && i < need); ctx.restore();
  }
  ctx.fillStyle = "rgba(232,244,242,.7)"; ctx.font = "12px system-ui"; ctx.fillText("★ concluir · ★ 75% dos frascos · ★ terminar com 3+ de vida", rx, CARD.y + 338);
  // mensagem
  ctx.textAlign = "center"; ctx.fillStyle = "#e8f4f2"; ctx.font = "15px system-ui"; wrapC(T.s, W/2, CARD.y + 372, CARD.w - 80, 20);
  ctx.fillStyle = th.edge; ctx.font = "bold 14px system-ui";
  ctx.fillText(last ? "Total no jogo: " + (G.carry + G.total) + " de " + TOTAL_ALL + " frascos" : T.next, W/2, CARD.y + 424);
  button(winBtns[0], T.b, true); button(winBtns[1], "Menu", false);
  ctx.textAlign = "left";
}
function wrapC(text, x, y, mw, lh) {
  const words = text.split(" "); let line = "";
  for (const w of words) {
    const test = line + w + " ";
    if (ctx.measureText(test).width > mw && line) { ctx.fillText(line.trim(), x, y); line = w + " "; y += lh; } else line = test;
  }
  ctx.fillText(line.trim(), x, y);
}
function updateLose() {
  if (wasPressed("enter")) respawnAfterDeath();
  if (wasPressed("escape","m")) state = "menu";
  if (mouse.click) {
    if (inRect(loseBtns[0], mouse.x, mouse.y)) respawnAfterDeath();
    if (inRect(loseBtns[1], mouse.x, mouse.y)) state = "menu";
  }
}
function drawLose(tt) {
  drawPlay(tt);
  ctx.fillStyle = "rgba(20,6,16,.84)"; ctx.fillRect(0, 0, W, H);
  const r = { x:190, y:120, w:580, h:360 };
  ctx.fillStyle = "#1c0d18"; roundRect(r.x, r.y, r.w, r.h, 18); ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = "#ff7a9a"; ctx.stroke();
  ctx.save(); roundRect(r.x, r.y, r.w, 70, 18); ctx.clip(); ctx.fillStyle = "#ff7a9a"; ctx.fillRect(r.x, r.y, r.w, 70); ctx.restore();
  ctx.textAlign = "center"; ctx.fillStyle = "#2a0d18"; ctx.font = "bold 32px system-ui"; ctx.fillText("Derrota", W/2, r.y + 46);
  for (let i = 0; i < MAXHP; i++) heart(W/2 - 76 + i * 28, r.y + 96, false);
  ctx.fillStyle = "#e8f4f2"; ctx.font = "16px system-ui"; wrapC("A vida chegou a zero. Você mantém os frascos coletados e volta ao último checkpoint com a vida cheia.", W/2, r.y + 150, r.w - 80, 22);
  ctx.fillStyle = "#ffb3c4"; ctx.font = "bold 14px system-ui";
  wrapC(G.boss && !G.boss.dead ? "Dica: " + G.boss.cfg.tip + " O boss recupera toda a vida." : "Dica: pule em cima dos Ruídos, destrua torres com ataques e desvie dos espinhos.", W/2, r.y + 214, r.w - 80, 20);
  button(loseBtns[0], "Tentar de novo", true); button(loseBtns[1], "Menu", false);
  ctx.textAlign = "left";
}

// ---------- Loop ----------
function frame(now) {
  const dt = Math.min(0.033, (now - t0) / 1000); t0 = now;
  if (state === "menu") { updateMenu(dt); drawMenu(now); }
  else if (state === "play") {
    updatePlay(dt);
    if (state === "menu") drawMenu(now); else if (state === "win") drawWin(now); else if (state === "lose") drawLose(now); else drawPlay(now);
  }
  else if (state === "win") { updateWin(dt); if (state === "win") drawWin(now); }
  else if (state === "lose") { updateLose(); if (state === "lose") drawLose(now); }
  let want = "menu";
  if (G && state !== "menu") {
    const k = LV.theme.kind;
    want = G.arena && G.boss && !G.boss.dead ? (k === "core" ? "finalboss" : "boss") : k;
  }
  setTrack(want);
  pressed = {}; mouse.click = false;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
cv.focus();
})();
</script>
